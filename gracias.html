<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Mensaje Recibido! | MATECH SOLUTIONS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #0a0a0a;
            padding: 3rem;
            border-radius: 15px;
            border: 1px solid #00A8C1;
            max-width: 400px;
        }
        i { font-size: 4rem; color: #00A8C1; margin-bottom: 1.5rem; }
        h1 { font-size: 1.8rem; margin-bottom: 1rem; text-transform: uppercase; }
        p { color: #b3b3b3; margin-bottom: 2rem; }
        .btn {
            background: #00A8C1;
            color: #000;
            padding: 0.8rem 2rem;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="card">
        <i class="fas fa-check-circle"></i>
        <h1>¡Solicitud Enviada!</h1>
        <p>Gracias por confiar en MATECH SOLUTIONS. Un especialista se pondrá en contacto con usted a la brevedad.</p>
        <a href="index.html" class="btn">VOLVER AL INICIO</a>
    </div>
</body>
</html>
