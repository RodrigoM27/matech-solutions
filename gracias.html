<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Mensaje Enviado! | MATECH SOLUTIONS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --negro-puro: #000000;
            --cian-matech: #00A8C1;
            --blanco: #ffffff;
            --gris-texto: #b3b3b3;
        }

        body {
            margin: 0;
            background-color: var(--negro-puro);
            color: var(--blanco);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            padding: 3rem;
            border: 1px solid #222;
            border-radius: 20px;
            background: #0a0a0a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .icon-check {
            font-size: 4rem;
            color: var(--cian-matech);
            margin-bottom: 1.5rem;
            animation: scaleIn 0.5s ease-out;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            color: var(--gris-texto);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-volver {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: var(--cian-matech);
            color: var(--negro-puro);
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn-volver:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 168, 193, 0.4);
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-check">
            <i class="fas fa-circle-check"></i>
        </div>
        <h1>¡Recibido!</h1>
        <p>Gracias por contactar a <strong>MATECH SOLUTIONS</strong>. Uno de nuestros especialistas IT revisará tu requerimiento y te contactará en breve.</p>
        <a href="index.html" class="btn-volver">VOLVER AL INICIO</a>
    </div>

</body>
</html>
